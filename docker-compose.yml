services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: finsight-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: finsight
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./config/database.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - finsight-network

  # Ollama LLM (GPU enabled)
  ollama:
    image: ollama/ollama:latest
    container_name: finsight-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:11434/api/tags || curl -f http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
      placement:
        constraints:
          - node.platform.os == linux
    networks:
      - finsight-network

  # Python Chatbot API
  finsight-bot:
    build:
      context: ./finsight-bot
      dockerfile: Dockerfile
    container_name: finsight-bot
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: mistral-nemo
    depends_on:
      ollama:
        condition: service_started
    networks:
      - finsight-network

  # Express API (Frontend + Backend)
  finsight-api:
    build:
      context: .
      dockerfile: finsight-api/Dockerfile
      args:
        FRONTEND_DIST: ./finsight-web/dist/finsight-web/browser
    container_name: finsight-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/finsight
      JWT_SECRET: ${JWT_SECRET:-finsight-jwt-secret-change-in-production}
      PYTHON_API_URL: http://finsight-bot:5000
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
      finsight-bot:
        condition: service_started
    networks:
      - finsight-network

  # Discord Bot
  finsight-discord:
    build:
      context: ./finsight-discord
      dockerfile: Dockerfile
    container_name: finsight-discord
    restart: unless-stopped
    environment:
      PYTHON_API_URL: http://finsight-bot:5000
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
    depends_on:
      finsight-bot:
        condition: service_started
    networks:
      - finsight-network

# Networks
networks:
  finsight-network:
    driver: bridge

# Volumes for persistence
volumes:
  postgres-data:
    driver: local
  ollama-models:
    driver: local